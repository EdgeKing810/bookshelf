# ─────────────────────────────────────────────────────────────────────────────
# bookshelf — production static site behind Traefik (nginx).
#
# Deployed by the .gitea workflow: the image is built in CI, pushed to the
# Gitea registry and pulled here. The compose image must match
# `${{ vars.REPO_ORIGIN }}/${{ gitea.repository }}:latest`.
# ─────────────────────────────────────────────────────────────────────────────
services:
  bookshelf:
    container_name: "bookshelf"
    image: "${BOOKSHELF_IMAGE:-gitea.konnect.dev/astro/bookshelf:latest}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_HOST: "${SITE_HOST:-books.kinesis.world}"
        SITE_SCHEME: "${SITE_SCHEME:-https}"
        BASE: "${BASE:-/}"
        PUBLIC_API_URL: "${PUBLIC_API_URL:-https://api.kinesis.world/x/bookshelf/}"
        PUBLIC_MEDIA_ORIGIN: "${PUBLIC_MEDIA_ORIGIN:-https://api.kinesis.world}"
        PUBLIC_UPLOAD_ORIGIN: "${PUBLIC_UPLOAD_ORIGIN:-}"
    network_mode: "bridge"
    restart: "always"
    environment:
      SITE_HOST: "${SITE_HOST:-books.kinesis.world}"
      SITE_SCHEME: "${SITE_SCHEME:-https}"
      SERVER_NAMES: "${SERVER_NAMES:-books.kinesis.world}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.bookshelf-service-http.entrypoints: "http"
      traefik.http.routers.bookshelf-service-http.rule: "Host(`books.kinesis.world`)"
      traefik.http.routers.bookshelf-service-http.middlewares: "https_redirect@file"
      traefik.http.routers.bookshelf-service-https.entrypoints: "https"
      traefik.http.routers.bookshelf-service-https.rule: "Host(`books.kinesis.world`)"
      traefik.http.routers.bookshelf-service-https.tls.certResolver: "acme-http"
      traefik.http.services.bookshelf-service-https.loadbalancer.server.port: "80"
